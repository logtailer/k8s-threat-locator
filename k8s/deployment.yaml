apiVersion: apps/v1
kind: Deployment
metadata:
  name: items-api
  namespace: threat-demo
  labels:
    app: items-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: items-api
  template:
    metadata:
      labels:
        app: items-api
    spec:
      serviceAccountName: app-sa
      containers:
        - name: items-api
          image: <ECR_REPO_URL>/k8s-threat-locator:<IMAGE_TAG>
          ports:
            - containerPort: 5000
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
