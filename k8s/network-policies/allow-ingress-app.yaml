apiVersion: crd.projectcalico.org/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-items-api
  namespace: threat-demo
spec:
  order: 200
  # Lower order value = higher priority in Calico; deny-all sits at 1000
  # Targets only the items-api pods in this namespace
  selector: app == "items-api"
  types:
    - Ingress
  ingress:
    - action: Allow
      protocol: TCP
      source:
        # Only pods with label role=frontend can reach the API on port 5000
        selector: role == "frontend"
      destination:
        ports:
          - 5000
    - action: Allow
      protocol: TCP
      source:
        # Allow intra-namespace traffic so items-api pods can health-check each other
        selector: app == "items-api"
      destination:
        ports:
          - 5000
