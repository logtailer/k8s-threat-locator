apiVersion: crd.projectcalico.org/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: threat-demo
spec:
  order: 1000
  # all() selects every pod in the namespace defined by the metadata.namespace field above
  selector: all()
  types:
    - Ingress
    - Egress
  ingress: []
  egress: []
