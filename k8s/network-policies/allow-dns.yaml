apiVersion: crd.projectcalico.org/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: threat-demo
spec:
  order: 100
  # all() targets every pod in the namespace — DNS is required for all pods
  selector: all()
  types:
    - Egress
  egress:
    # Both UDP and TCP port 53 — DNS uses UDP but falls back to TCP for large responses
    - action: Allow
      protocol: UDP
      destination:
        namespaceSelector: has(k8s-app) && k8s-app == "kube-dns"
        ports:
          - 53
    - action: Allow
      protocol: TCP
      destination:
        namespaceSelector: has(k8s-app) && k8s-app == "kube-dns"
        ports:
          - 53
