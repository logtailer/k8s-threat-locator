apiVersion: crd.projectcalico.org/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-items-api
  namespace: threat-demo
spec:
  order: 200
  # Lower order value = higher priority in Calico; deny-all sits at 1000
  selector: app == "items-api"
  types:
    - Egress
  egress:
    # Allow outbound on port 5000 for inter-pod health checks within the cluster
    - action: Allow
      protocol: TCP
      destination:
        ports:
          - 5000
    # Allow HTTPS within the VPC only: covers kube-apiserver, and STS for IRSA token exchange.
    # STS resolves to a private IP because the STS Interface VPC endpoint has private_dns_enabled=true.
    # No internet-facing 0.0.0.0/0 rule: S3 and other AWS services are not required at runtime.
    - action: Allow
      protocol: TCP
      destination:
        nets:
          - "10.0.0.0/8"
        ports:
          - 443
    # Deny all other egress — falls through to default-deny at order 1000
