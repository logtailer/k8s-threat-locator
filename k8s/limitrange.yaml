apiVersion: v1
kind: LimitRange
metadata:
  name: threat-demo-limits
  namespace: threat-demo
spec:
  limits:
    - type: Container
      default:
        cpu: "250m"
        memory: "256Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      max:
        cpu: "500m"
        memory: "512Mi"
