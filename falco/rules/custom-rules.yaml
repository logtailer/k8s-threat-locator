- macro: items_api_container
  condition: container.name = "items-api"

- rule: shell_in_container
  desc: Detect a shell binary being spawned inside a running container
  condition: >
    spawned_process
    and container
    and items_api_container
    and proc.name in (shell_binaries)
  enabled: true
  output: >
    Shell spawned in container
    (user=%user.name user_uid=%user.uid container_id=%container.id container_name=%container.name
    pod=%k8s.pod.name ns=%k8s.ns.name image=%container.image.repository
    image_tag=%container.image.tag pod_uid=%k8s.pod.uid parent=%proc.pname cmd=%proc.cmdline)
  priority: ERROR
  exceptions: []
  tags: [shell, container, mitre_execution, force_quarantine]

- rule: write_to_etc
  desc: Detect any file write attempt under /etc/ inside a container
  enabled: true
  condition: >
    open_write
    and container
    and fd.name startswith /etc/
    and not proc.name in (package_mgmt_binaries)
  output: >
    Write to /etc detected in container
    (user=%user.name file=%fd.name container_id=%container.id
    container_name=%container.name pod=%k8s.pod.name ns=%k8s.ns.name
    image=%container.image.repository pod_uid=%k8s.pod.uid)
  priority: ERROR
  exceptions: []
  tags: [filesystem, container, mitre_persistence, force_quarantine]

- rule: unexpected_outbound_connection
  desc: Detect outbound network connections on unexpected ports from items-api
  enabled: true
  condition: >
    outbound
    and items_api_container
    and not fd.rport in (443, 53, 5000, 80)
    and fd.rport > 0
  output: >
    Unexpected outbound connection from items-api
    (user=%user.name proc=%proc.name cmd=%proc.cmdline dest_ip=%fd.rip dest_port=%fd.rport
    container_id=%container.id pod=%k8s.pod.name ns=%k8s.ns.name
    image=%container.image.repository pod_uid=%k8s.pod.uid)
  priority: WARNING
  exceptions: []
  tags: [network, container, mitre_exfiltration]

- rule: imds_access_from_container
  desc: Detect access to the cloud instance metadata endpoint from items-api (possible SSRF / credential theft)
  enabled: true
  condition: >
    outbound
    and items_api_container
    and fd.rip = "169.254.169.254"
  output: >
    IMDS access from items-api
    (user=%user.name proc=%proc.name cmd=%proc.cmdline dest_ip=%fd.rip dest_port=%fd.rport
    container_id=%container.id pod=%k8s.pod.name ns=%k8s.ns.name
    image=%container.image.repository pod_uid=%k8s.pod.uid)
  priority: ERROR
  exceptions: []
  tags: [network, container, mitre_credential_access, force_quarantine]

# ── Detect-only rules (ERROR, no force_quarantine) ────────────────────────────
# Observe real signal before promoting any of these to auto-quarantine.

- rule: serviceaccount_token_read
  desc: Detect a read of the mounted Kubernetes ServiceAccount token from items-api (credential theft)
  enabled: true
  condition: >
    open_read
    and items_api_container
    and fd.name contains "/serviceaccount/token"
  output: >
    ServiceAccount token read in items-api
    (user=%user.name proc=%proc.name cmd=%proc.cmdline file=%fd.name
    container_id=%container.id pod=%k8s.pod.name ns=%k8s.ns.name
    image=%container.image.repository pod_uid=%k8s.pod.uid)
  priority: ERROR
  exceptions: []
  tags: [filesystem, container, mitre_credential_access]

- rule: proc_environ_read
  desc: Detect a read of /proc/<pid>/environ from items-api (leaks env-injected secrets)
  enabled: true
  condition: >
    open_read
    and items_api_container
    and fd.name startswith /proc/
    and fd.name endswith /environ
  output: >
    /proc environ read in items-api
    (user=%user.name proc=%proc.name cmd=%proc.cmdline file=%fd.name
    container_id=%container.id pod=%k8s.pod.name ns=%k8s.ns.name
    image=%container.image.repository pod_uid=%k8s.pod.uid)
  priority: ERROR
  exceptions: []
  tags: [filesystem, container, mitre_credential_access]

- rule: reverse_shell_via_interpreter
  desc: Detect an interpreter used as a reverse shell in items-api (shell_in_container misses this — no shell binary is spawned)
  enabled: true
  condition: >
    spawned_process
    and items_api_container
    and proc.name in (python, python3, perl, ruby, node)
    and (proc.cmdline contains "socket"
         or proc.cmdline contains "/dev/tcp"
         or proc.cmdline contains "pty.spawn"
         or proc.cmdline contains "os.dup2"
         or proc.cmdline contains "fsockopen")
  output: >
    Interpreter reverse shell in items-api
    (user=%user.name proc=%proc.name parent=%proc.pname cmd=%proc.cmdline
    container_id=%container.id pod=%k8s.pod.name ns=%k8s.ns.name
    image=%container.image.repository pod_uid=%k8s.pod.uid)
  priority: ERROR
  exceptions: []
  tags: [shell, container, mitre_execution]

- rule: container_escape_attempt
  desc: Detect namespace/mount tooling in items-api commonly used to break out of a container
  enabled: true
  condition: >
    spawned_process
    and items_api_container
    and proc.name in (mount, umount, unshare, setns, nsenter)
  output: >
    Container escape tooling in items-api
    (user=%user.name proc=%proc.name parent=%proc.pname cmd=%proc.cmdline
    container_id=%container.id pod=%k8s.pod.name ns=%k8s.ns.name
    image=%container.image.repository pod_uid=%k8s.pod.uid)
  priority: ERROR
  exceptions: []
  tags: [process, container, mitre_privilege_escalation]

# The in-cluster Kubernetes API is the .1 of the service CIDR. These cover the
# common EKS/kubeadm defaults — adjust to your cluster's kubernetes.default.svc
# ClusterIP (kubectl get svc kubernetes -o jsonpath='{.spec.clusterIP}').
- macro: k8s_api_server_ip
  condition: fd.rip in ("172.20.0.1", "10.100.0.1", "10.96.0.1")

- rule: k8s_api_access_from_pod
  desc: Detect items-api talking to the in-cluster Kubernetes API (a stolen SA token being used — invisible to the port-443 outbound allowlist)
  enabled: true
  condition: >
    outbound
    and items_api_container
    and k8s_api_server_ip
  output: >
    Kubernetes API access from items-api
    (user=%user.name proc=%proc.name cmd=%proc.cmdline dest_ip=%fd.rip dest_port=%fd.rport
    container_id=%container.id pod=%k8s.pod.name ns=%k8s.ns.name
    image=%container.image.repository pod_uid=%k8s.pod.uid)
  priority: ERROR
  exceptions: []
  tags: [network, container, mitre_discovery]

- rule: drop_and_execute_new_binary
  desc: Detect items-api executing a binary from a writable temp directory (payload dropped then run)
  enabled: true
  condition: >
    spawned_process
    and items_api_container
    and (proc.exepath startswith /tmp/
         or proc.exepath startswith /var/tmp/
         or proc.exepath startswith /dev/shm/)
  output: >
    Execution from writable temp dir in items-api
    (user=%user.name proc=%proc.name exe=%proc.exepath cmd=%proc.cmdline
    container_id=%container.id pod=%k8s.pod.name ns=%k8s.ns.name
    image=%container.image.repository pod_uid=%k8s.pod.uid)
  priority: ERROR
  exceptions: []
  tags: [process, container, mitre_execution]

