# Helm values for falcosecurity/falco chart v4.3.0
# Install: helm repo add falcosecurity https://falcosecurity.github.io/charts
#          helm install falco falcosecurity/falco -n falco --create-namespace -f falco/values.yaml

driver:
  # module: kernel module (default). Alternative: ebpf (more compatible with newer kernels).
  kind: module

falco:
  json_output: true
  json_include_output_property: true
  json_include_tags_property: true
  log_level: info
  log_stderr: true
  priority: debug
  output_timeout: 2000
  buffered_outputs: false
  grpc:
    enabled: false

falcosidekick:
  enabled: true
  replicaCount: 2
  config:
    aws:
      sns:
        # Replace with your SNS topic ARN after deploying the Lambda stack
        topicarn: ""
        minimumpriority: "error"
      region: "us-east-1"
      # roleName: "" # optional: IAM role for falcosidekick to assume when calling SNS
    debug: false
    nooutput: false

tolerations:
  # Allow scheduling on control-plane / master nodes if present
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule

# Restrict to Linux — Falco does not support Windows nodes
nodeSelector:
  kubernetes.io/os: linux

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: eks.amazonaws.com/nodegroup
              operator: Exists
            # Exclude Fargate — Falco requires kernel module access.
            # Fargate nodes do not expose /proc or allow privileged containers.
            - key: eks.amazonaws.com/compute-type
              operator: NotIn
              values:
                - fargate


resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "200m"
    memory: "256Mi"
