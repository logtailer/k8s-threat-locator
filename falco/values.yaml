# Helm values for falcosecurity/falco chart v4.x
# Install: helm repo add falcosecurity https://falcosecurity.github.io/charts
#          helm install falco falcosecurity/falco -n falco --create-namespace -f falco/values.yaml

driver:
  kind: module

falco:
  json_output: true
  json_include_output_property: true
  log_level: info
  log_stderr: true
  output_timeout: 2000

falcosidekick:
  enabled: true
  config:
    aws:
      sns:
        # Replace with your SNS topic ARN after deploying the Lambda stack
        topicarn: ""
      region: "us-east-1"
    debug: false

tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule

nodeSelector:
  kubernetes.io/os: linux

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: eks.amazonaws.com/nodegroup
              operator: Exists
            # exclude Fargate — Falco requires kernel access and cannot run on Fargate
            - key: eks.amazonaws.com/compute-type
              operator: NotIn
              values:
                - fargate

