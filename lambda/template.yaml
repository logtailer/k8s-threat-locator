AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  k8s-threat-locator incident responder — triggered by Falco alerts via SNS,
  applies a quarantine NetworkPolicy to isolate the offending pod.

Globals:
  Function:
    Runtime: python3.11
    MemorySize: 128
    Timeout: 60

Parameters:
  SnsTopicArn:
    Type: String
    Description: ARN of the SNS topic that Falcosidekick publishes to (leave blank to create a new topic)
    Default: ""

  KubeconfigBucket:
    Type: String
    Description: S3 bucket name where the kubeconfig is stored

  KubeconfigKey:
    Type: String
    Default: kubeconfig
    Description: S3 object key for the kubeconfig file

Resources:
  FalcoAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: falco-alerts
      Tags:
        - Key: Project
          Value: k8s-threat-locator
        - Key: ManagedBy
          Value: sam

  FalcoAlertsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref FalcoAlertsTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowFalcosidekickPublish
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: sns:Publish
            Resource: !Ref FalcoAlertsTopic

  QuarantineDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: k8s-threat-locator-dlq
      MessageRetentionPeriod: 1209600  # 14 days

  IncidentResponderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: k8s-threat-locator-responder
      CodeUri: .
      Handler: handler.handler
      Description: Quarantines compromised Kubernetes pods on Falco alert
      Role: !GetAtt IncidentResponderRole.Arn
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt QuarantineDLQ.Arn
      Tags:
        Project: k8s-threat-locator
        ManagedBy: sam
      Environment:
        Variables:
          KUBECONFIG_BUCKET: !Ref KubeconfigBucket
          KUBECONFIG_KEY: !Ref KubeconfigKey
          METRIC_NAMESPACE: k8s-threat-locator
      Events:
        FalcoAlert:
          Type: SNS
          Properties:
            Topic: !Ref FalcoAlertsTopic
            FilterPolicy:
              priority:
                - ERROR
                - CRITICAL

  IncidentResponderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: k8s-threat-locator-lambda-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3KubeconfigRead
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowKubeconfigGet
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${KubeconfigBucket}/${KubeconfigKey}"
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/k8s-threat-locator-responder:*"
        - PolicyName: CloudWatchMetrics
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                # PutMetricData does not support resource-level permissions
                Resource: "*"
        - PolicyName: DLQSendMessage
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt QuarantineDLQ.Arn

  QuarantineAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: k8s-threat-locator-quarantine-rate
      AlarmDescription: Fires when more than 5 pods are quarantined in 5 minutes — possible attack wave or runaway rule
      Namespace: k8s-threat-locator
      MetricName: QuarantineApplied
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  DLQDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: k8s-threat-locator-dlq-depth
      AlarmDescription: Fires when failed quarantine attempts accumulate in the DLQ
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt QuarantineDLQ.QueueName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  FunctionArn:
    Description: ARN of the incident responder Lambda function
    Value: !GetAtt IncidentResponderFunction.Arn
  FunctionName:
    Description: Name of the incident responder Lambda function
    Value: !Ref IncidentResponderFunction
  DeadLetterQueueUrl:
    Description: URL of the DLQ — monitor this for failed quarantine attempts
    Value: !Ref QuarantineDLQ
  DeadLetterQueueArn:
    Description: ARN of the DLQ
    Value: !GetAtt QuarantineDLQ.Arn
  SnsTopicArn:
    Description: ARN of the Falco alerts SNS topic — wire this into Falcosidekick config
    Value: !Ref FalcoAlertsTopic
