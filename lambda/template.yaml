AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  k8s-threat-locator incident responder — triggered by Falco alerts via SNS,
  applies a quarantine NetworkPolicy to isolate the offending pod.

Globals:
  Function:
    Runtime: python3.11
    MemorySize: 128
    Timeout: 60

Parameters:
  SnsTopicArn:
    Type: String
    Description: ARN of the SNS topic that Falcosidekick publishes to

  KubeconfigBucket:
    Type: String
    Description: S3 bucket name where the kubeconfig is stored

  KubeconfigKey:
    Type: String
    Default: kubeconfig
    Description: S3 object key for the kubeconfig file

  AlertPriorityFilter:
    Type: String
    Default: "ERROR,CRITICAL"
    Description: Comma-separated Falco priority levels that trigger quarantine

Resources:
  IncidentResponderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: k8s-threat-locator-responder
      CodeUri: .
      Handler: handler.handler
      Description: Quarantines compromised Kubernetes pods on Falco alert
      ReservedConcurrentExecutions: 10
      Role: !GetAtt IncidentResponderRole.Arn
      Tags:
        Project: k8s-threat-locator
        ManagedBy: sam
      Environment:
        Variables:
          KUBECONFIG_BUCKET: !Ref KubeconfigBucket
          KUBECONFIG_KEY: !Ref KubeconfigKey
          AWS_DEFAULT_REGION: !Ref AWS::Region
      Events:
        FalcoAlert:
          Type: SNS
          Properties:
            Topic: !Ref SnsTopicArn
            FilterPolicy:
              priority:
                - ERROR
                - CRITICAL

  IncidentResponderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: k8s-threat-locator-lambda-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3KubeconfigRead
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowKubeconfigGet
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${KubeconfigBucket}/${KubeconfigKey}"
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/k8s-threat-locator-responder:*"
        - PolicyName: CloudWatchMetrics
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                # PutMetricData does not support resource-level permissions
                Resource: "*"

Outputs:
  FunctionArn:
    Description: ARN of the incident responder Lambda function
    Value: !GetAtt IncidentResponderFunction.Arn
  FunctionName:
    Description: Name of the incident responder Lambda function
    Value: !Ref IncidentResponderFunction
