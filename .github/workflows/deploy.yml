name: Deploy

on:
  workflow_dispatch:
    inputs:
      ecr_url:
        description: ECR repository URL (e.g. 261599401243.dkr.ecr.us-east-1.amazonaws.com/k8s-threat-locator)
        required: true
      image_tag:
        description: Docker image tag (leave blank to use commit SHA)
        required: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  push-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::261599401243:role/gh.logtailer.actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image tag
        id: tag
        run: echo "value=${{ inputs.image_tag || github.sha }}" >> $GITHUB_OUTPUT

      # CI Trivy gate intentionally blocks the push job in ci.yml (Flask==1.0.0 CVEs).
      # This workflow pushes directly to ECR for sandbox deployment with known vulnerabilities.
      - name: Build and push to ECR
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ${{ inputs.ecr_url }}:${{ steps.tag.outputs.value }}
            ${{ inputs.ecr_url }}:latest

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: push-image
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::261599401243:role/gh.logtailer.actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve image tag
        id: tag
        run: echo "value=${{ inputs.image_tag || github.sha }}" >> $GITHUB_OUTPUT

      - name: Confirm image exists in ECR
        run: |
          aws ecr describe-images \
            --repository-name k8s-threat-locator \
            --image-ids imageTag=${{ steps.tag.outputs.value }} \
            --region ${{ env.AWS_REGION }} \
            --query 'imageDetails[0].{digest:imageDigest,pushed:imagePushedAt,size:imageSizeInBytes}' \
            --output table
