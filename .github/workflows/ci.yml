name: CI
# Trivy scan gate: pipeline fails on any HIGH or CRITICAL CVE in the app image.
# The push job only runs after the scan passes — intentionally blocked by Flask==1.0.0.
# Permissions are scoped to minimum required for each job.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  IMAGE_NAME: k8s-threat-locator

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      image-tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      # Save the exact image so the scan and push jobs reuse these bytes
      # instead of rebuilding — guarantees we promote what we scanned.
      - name: Save image as artifact
        run: docker save ${{ env.IMAGE_NAME }}:${{ github.sha }} -o /tmp/image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-image
          path: /tmp/image.tar
          retention-days: 1

  trivy-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: app-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/image.tar

      - name: Scan image and upload SARIF
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          trivyignores: app/.trivyignore

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          wait-for-processing: true

      # Hard gate: exits 1 if any HIGH or CRITICAL CVEs are present (fixable or not).
      # This blocks the push job and keeps vulnerable images off ECR.
      # will_not_fix and fix_deferred base-image CVEs are listed in app/.trivyignore.
      # The intentional Flask==1.0.0 / Werkzeug==0.14.1 / Jinja2==2.10 CVEs are HIGH
      # severity and are NOT ignored — they keep this gate permanently red.
      - name: Fail on HIGH and CRITICAL CVEs
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: table
          trivyignores: app/.trivyignore

  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: trivy-scan
    permissions:
      id-token: write
      contents: read
    # only push on direct pushes to main, not on pull_request events
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::261599401243:role/gh.logtailer.actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: app-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/image.tar

      # Push the exact bytes Trivy scanned — no rebuild.
      - name: Tag and push scanned image to ECR
        run: |
          REG=${{ steps.ecr-login.outputs.registry }}
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} "$REG/k8s-threat-locator:${{ github.sha }}"
          docker push "$REG/k8s-threat-locator:${{ github.sha }}"
