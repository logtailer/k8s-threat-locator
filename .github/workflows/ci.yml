name: CI
# The image is built once in the build job and passed to the scan and push
# jobs as an artifact, so the bytes promoted to ECR are exactly the bytes
# Trivy scanned. Trivy gate: pipeline fails on any HIGH or CRITICAL CVE in the
# app image. The push job only runs after the scan passes — intentionally
# blocked by Flask==1.0.0. Permissions are scoped to minimum per job.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  IMAGE_NAME: k8s-threat-locator

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      image-tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Build image
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: ./app
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      # Save the exact image so the scan and push jobs reuse these bytes
      # instead of rebuilding — guarantees we promote what we scanned.
      - name: Save image as artifact
        run: docker save ${{ env.IMAGE_NAME }}:${{ github.sha }} -o /tmp/image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: app-image
          path: /tmp/image.tar
          retention-days: 1

  trivy-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Download image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: app-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/image.tar

      - name: Scan image and upload SARIF
        uses: aquasecurity/trivy-action@b2933f565dbc598b29947660e66259e3c7bc8561  # v0.20.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          trivyignores: app/.trivyignore

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@02c5e83432fe5497fd85b873b6c9f16a8578e1d9  # v3
        with:
          sarif_file: trivy-results.sarif
          wait-for-processing: true

      # Hard gate: exits 1 if any HIGH or CRITICAL CVEs are present (fixable or not).
      # This blocks the push job and keeps vulnerable images off ECR.
      # will_not_fix and fix_deferred base-image CVEs are listed in app/.trivyignore.
      # The intentional Flask==1.0.0 / Werkzeug==0.14.1 / Jinja2==2.10 CVEs are HIGH
      # severity and are NOT ignored — they keep this gate permanently red.
      - name: Fail on HIGH and CRITICAL CVEs
        uses: aquasecurity/trivy-action@b2933f565dbc598b29947660e66259e3c7bc8561  # v0.20.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: table
          trivyignores: app/.trivyignore

  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: trivy-scan
    permissions:
      id-token: write
      contents: read
    # only push on direct pushes to main, not on pull_request events
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::261599401243:role/gh.logtailer.actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: app-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/image.tar

      # Push the exact bytes Trivy scanned — no rebuild.
      - name: Tag and push scanned image to ECR
        run: |
          REG=${{ steps.ecr-login.outputs.registry }}
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} "$REG/k8s-threat-locator:${{ github.sha }}"
          docker push "$REG/k8s-threat-locator:${{ github.sha }}"
